<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация: Арифметические действия над натуральными числами</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 800px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.95rem;
            color: #a0a0c0;
        }

        .presentation-scroll-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .slide-card {
            background: #16162a;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid #2a2a4a;
            overflow: hidden;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .slide-info {
            background: #1f1f3d;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: #00d2ff;
            border-bottom: 1px solid #2a2a4a;
            font-weight: bold;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background-color: #0d0d1a;
        }

        .loading-status {
            color: #00d2ff;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Царство Науки: Арифметические действия</h1>
        <p>Материалы урока математики • 5 класс • Лента слайдов</p>
    </div>

    <div id="loading" class="loading-status">Загрузка космических архивов науки...</div>

    <div class="presentation-scroll-container" id="slides-container"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        const scale = 2;
        const container = document.getElementById('slides-container');

        // УМНЫЙ ПОИСК: Пытаемся угадать имя файла, если оно написано с ошибками или по-русски
        const possibleNames = [
            './presentation.pdf',
            './presentation.PDF',
            './Презентация Белянская С.С..pdf',
            './Презентация Белянская С.С..PDF',
            'Презентация Белянская С.С..pdf'
        ];

        function tryLoadPdf(index) {
            if (index >= possibleNames.length) {
                // Если перебрали все имена и ничего не нашли
                document.getElementById('loading').innerHTML = 
                    `<div style="color:#ff4a4a; padding: 20px; text-align:center;">` +
                    `<h4>Презентация не найдена на сервере</h4>` +
                    `<p style="font-size:0.9rem; color:#aaa; margin-top:5px;">` +
                    `Пожалуйста, переименуйте ваш PDF-файл на GitHub так, чтобы он назывался латинскими буквами: <b>presentation.pdf</b></p></div>`;
                return;
            }

            const currentUrl = possibleNames[index];
            
            pdfjsLib.getDocument(currentUrl).promise.then(function(pdfDoc) {
                // Если файл успешно подгрузился, убираем загрузку и рендерим
                document.getElementById('loading').style.display = 'none';

                for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                    const card = document.createElement('div');
                    card.className = 'slide-card';

                    const info = document.createElement('div');
                    info.className = 'slide-info';
                    info.textContent = `Слайд № ${pageNum}`;
                    card.appendChild(info);

                    const canvas = document.createElement('canvas');
                    card.appendChild(canvas);
                    container.appendChild(card);

                    const ctx = canvas.getContext('2d');

                    pdfDoc.getPage(pageNum).then(function(page) {
                        const viewport = page.getViewport({ scale: scale });
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        const renderContext = {
                            canvasContext: ctx,
                            viewport: viewport
                        };
                        page.render(renderContext);
                    });
                }
            }).catch(function(error) {
                // Если текущее имя выдало ошибку, пробуем следующее из списка
                console.log(`Имя ${currentUrl} не подошло, пробуем следующее...`);
                tryLoadPdf(index + 1);
            });
        }

        // Запускаем автоматический подбор имени файла
        tryLoadPdf(0);
    </script>
</body>
</html>
